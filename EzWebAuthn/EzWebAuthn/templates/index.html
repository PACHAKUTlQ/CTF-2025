{% extends "base.html" %}
{% block title %}主页{% endblock %}
{% block content %}
  <main class="d-flex align-items-center justify-content-center vh-100 bg-light">
    <div class="card p-4 border-0 shadow-lg"
         style="max-width: 400px;
                width: 100%">
      <div class="card-body text-center">
        {% if user.role == 'admin' %}
          <h3>欢迎管理员 {{ user.username }}！</h3>
          <p>{{ flag }}</p>
        {% else %}
          <h3>欢迎 {{ user.username }}</h3>
          <p>只有管理员才能看到 Flag 哦！加油喵～</p>
        {% endif %}
        <button class="btn btn-dark w-100 mb-2 d-flex align-items-center justify-content-center"
                id="logout"
                onclick="location.href='/logout'">
          <i class="bi bi-person-fill-down me-2"></i> 退出登录
        </button>
      </div>
    </div>
  </main>
{% endblock %}
