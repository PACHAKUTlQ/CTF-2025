{% extends "base.html" %}
{% block title %}登录/注册{% endblock %}
{% block content %}
    <main class="d-flex align-items-center justify-content-center vh-100 bg-light">
        <div class="card p-4 border-0 shadow-lg"
             style="max-width: 400px;
                    width: 100%">
            <div class="card-body text-center">
                <h3 class="card-title mb-4">登录/注册</h3>
                <button class="btn btn-dark w-100 mb-2 d-flex align-items-center justify-content-center"
                        id="login">
                    <i class="bi bi-key me-2"></i> 使用 Passkey 登录
                </button>
                <div class="d-flex align-items-center my-3">
                    <hr class="flex-grow-1" />
                    <span class="mx-2 text-muted">或</span>
                    <hr class="flex-grow-1" />
                </div>
                <input class="form-control w-100 mb-3 d-flex align-items-center justify-content-center"
                       type="text"
                       id="username"
                       placeholder="用户名" />
                <button class="btn btn-outline-secondary w-100 mb-3 d-flex align-items-center justify-content-center"
                        id="register">
                    <i class="bi bi-person-fill-add me-2"></i> 使用 Passkey 注册
                </button>
                <p class="text-muted mt-3 mb-0">* 题目环境每5分钟重置一次</p>
            </div>
        </div>
    </main>
{% endblock %}
{% block script %}
    <script src="/static/simplewebauthn.min.js"></script>
    <script src="/static/auth.js"></script>
{% endblock %}
